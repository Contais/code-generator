spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

generator:
  output-package: com.example.code
  author: generator
  output-dir: ./generated-sources
  include-tables: []
  table-prefix:
    - sys_
    - t_
  exclude-tables: []
  plural-to-singular: true
